<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Court blue is the brand colour; ball yellow is the one accent, used only as a fill. */
  :root {
    color-scheme: light dark;
    --paper: #f6f7f3;
    --surface: #ffffff;
    --ink: #11161d;
    --ink-2: #48525e;
    --ink-3: #66707c;
    --line: #dcdfd8;
    --line-strong: #b9beb5;
    --court: #1b4fa0;
    --court-hover: #163f82;
    --court-ink: #ffffff;
    --court-tint: #e7eef8;
    --band: #1b4fa0;
    --band-ink: #ffffff;
    --band-ink-2: rgba(255, 255, 255, 0.8);
    --ball: #dcf04a;
    --ball-tint: #f2f9c4;
    --ball-ink: #11161d;
    --danger: #b42318;
    --focus: #1b4fa0;
    --display: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --text: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1318;
      --surface: #171c23;
      --ink: #e8ecf1;
      --ink-2: #aab4c0;
      --ink-3: #8b96a3;
      --line: #2a313b;
      --line-strong: #3d4652;
      --court: #6e9bea;
      --court-hover: #89aff0;
      --court-ink: #0f1318;
      --court-tint: #1a2537;
      --band: #142b52;
      --band-ink: #f1f5fa;
      --band-ink-2: rgba(241, 245, 250, 0.78);
      --ball: #d6ec45;
      --ball-tint: #2a3014;
      --danger: #f97066;
      --focus: #8eb2f2;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .skip-link {
    position: absolute; left: 12px; top: -60px; z-index: 30;
    background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-weight: 600;
  }
  .skip-link:focus { top: 12px; }

  /* Top bar */
  .topbar { background: var(--band); color: var(--band-ink); }
  .topbar-inner {
    max-width: 560px; margin: 0 auto; padding: 14px 16px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 24px; height: 24px; flex: none; }
  .brand-name {
    font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1;
    text-transform: uppercase; letter-spacing: 0.01em;
  }
  .topbar-meta { font-size: 15px; color: var(--band-ink-2); }
  .topbar-meta:empty { display: none; }

  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  main:focus { outline: none; }

  /* Type */
  .page-title { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.02; }
  .lede { margin-top: 10px; font-size: 18px; color: var(--ink-2); max-width: 40ch; }
  .section { margin-top: 40px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
  .section-title { display: block; font-size: 20px; font-weight: 700; line-height: 1.3; }
  .group-title { display: block; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .count, .muted { color: var(--ink-3); font-weight: 500; }
  .hint { margin-top: 10px; font-size: 15px; color: var(--ink-2); }
  .hint.first { margin: 4px 0 12px; }
  .note { font-size: 16px; color: var(--ink); }
  .field-error { margin-top: 8px; font-size: 15px; color: var(--danger); font-weight: 600; }
  .field-error:empty { display: none; }
  .loading { font-size: 18px; color: var(--ink-2); }

  /* Setup form */
  .form { margin-top: 12px; }
  .form-group { padding: 24px 0; border-bottom: 1px solid var(--line); }

  .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    text-align: left; padding: 14px; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--radius);
  }
  .choice:hover { border-color: var(--ink-3); }
  .choice[aria-pressed="true"] { border-color: var(--court); box-shadow: inset 0 0 0 1.5px var(--court); background: var(--court-tint); }
  .choice-name { display: block; font-size: 18px; font-weight: 700; }
  .choice-desc { display: block; margin-top: 2px; font-size: 15px; line-height: 1.35; color: var(--ink-2); }

  .segmented { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg {
    min-width: 54px; height: 46px; padding: 0 12px; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 8px;
    font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .seg:hover:not(:disabled) { border-color: var(--ink-3); }
  .seg[aria-pressed="true"] { background: var(--court); border-color: var(--court); color: var(--court-ink); }
  .seg:disabled { opacity: 0.4; cursor: not-allowed; }

  .player-list { list-style: none; margin-bottom: 12px; border-top: 1px solid var(--line); }
  .player-list:empty { display: none; }
  .player-list li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 50px; font-size: 18px; font-weight: 500; border-bottom: 1px solid var(--line);
  }
  .player-list li span { min-width: 0; overflow-wrap: anywhere; }
  .icon-btn {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center; cursor: pointer;
    background: none; border: 0; border-radius: 8px; color: var(--ink-3);
  }
  .icon-btn:hover { color: var(--danger); background: var(--court-tint); }
  .icon-btn svg { width: 18px; height: 18px; }

  .input-row { display: flex; gap: 8px; }
  .inline-field { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 17px; color: var(--ink-2); }
  .input {
    flex: 1; min-width: 0; height: 48px; padding: 0 14px;
    background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 8px; font-size: 18px;
  }
  .input::placeholder { color: var(--ink-3); }
  .input:hover { border-color: var(--ink-3); }
  .input[aria-invalid="true"] { border-color: var(--danger); }
  .input-sm { flex: none; width: 96px; text-align: center; font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 18px; cursor: pointer; white-space: nowrap;
    border: 1.5px solid transparent; border-radius: 8px; font-size: 17px; font-weight: 700; text-decoration: none;
  }
  .btn-primary { background: var(--court); color: var(--court-ink); }
  .btn-primary:hover:not(:disabled) { background: var(--court-hover); }
  .btn-secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--ink-2); }
  .btn-text { height: 44px; padding: 0 2px; background: none; color: var(--court); }
  .btn-text:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 3px; }
  .btn-text.danger { color: var(--danger); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .start { margin-top: 28px; }

  /* Tournament: share line */
  .share-line {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 12px 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .share-text { min-width: 0; }
  .share-url { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .share-meta { font-size: 14px; color: var(--ink-2); }
  .badge {
    display: inline-block; margin-bottom: 4px; padding: 1px 8px; border-radius: 6px;
    background: var(--ball); color: var(--ball-ink); font-size: 14px; font-weight: 700;
  }

  /* Tournament: rounds */
  .round-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 28px 0 20px; }
  .round-tab {
    position: relative; min-width: 46px; height: 46px; padding: 0 10px; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 8px;
    font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .round-tab:hover { border-color: var(--ink-3); }
  .round-tab[aria-current="true"] { background: var(--court); border-color: var(--court); color: var(--court-ink); }
  .round-tab.is-done::after {
    content: ''; position: absolute; top: 5px; right: 5px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 1.5px var(--ink);
  }

  .round-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .round-title { font-family: var(--display); font-size: 46px; font-weight: 800; line-height: 1; }
  .round-title .of { color: var(--ink-3); }
  .resting { font-size: 16px; color: var(--ink-2); }

  .match { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .court-name { padding: 10px 16px 2px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .team-row { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 12px 8px 16px; }
  .team-row + .team-row { border-top: 1px solid var(--line); }
  .team-row.is-winner { background: var(--ball-tint); }
  .team-row.is-winner .team-names { font-weight: 700; }
  .team-names { flex: 1; min-width: 0; font-size: 19px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .amp { color: var(--ink-3); }
  .score {
    width: 78px; height: 56px; flex: none; text-align: center;
    background: var(--paper); border: 1.5px solid var(--line-strong); border-radius: 8px;
    font-family: var(--display); font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
  }
  .score::-webkit-outer-spin-button, .score::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .score::placeholder { color: var(--ink-3); }
  .score:hover { border-color: var(--ink-3); }
  .score-static { display: grid; place-items: center; background: none; border-color: transparent; }
  .team-row.is-winner .score:not(.score-static) { background: var(--surface); }

  .round-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .round-actions .btn-next { margin-left: auto; }
  .format-action { margin-top: 16px; }
  .format-action .btn { width: 100%; }

  /* Tournament: standings */
  .standings { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .standings th {
    padding: 8px 8px; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink-2);
    border-bottom: 1.5px solid var(--line-strong);
  }
  .standings td { padding: 10px 8px; font-size: 18px; border-bottom: 1px solid var(--line); }
  .standings .num { text-align: right; }
  .standings .name { overflow-wrap: anywhere; }
  .standings .rank { width: 36px; color: var(--ink-3); font-weight: 600; }
  .standings .pts { font-family: var(--display); font-size: 24px; font-weight: 800; line-height: 1; }
  .standings .pts.is-zero { color: var(--ink-3); }
  .standings tr.is-leader td { background: var(--ball-tint); font-weight: 700; }
  .standings tr.is-leader .rank { color: var(--ink); }
  .refresh { margin-top: 16px; }

  /* Tournament: admin code */
  .admin-code { font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: 0.06em; line-height: 1.1; margin-bottom: 12px; }

  /* Footer and toast */
  .site-footer {
    width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px 36px;
    font-size: 15px; color: var(--ink-3); border-top: 1px solid var(--line);
  }
  .site-footer a { color: var(--court); font-weight: 600; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 20;
    width: fit-content; max-width: 528px; margin: 0 auto;
    padding: 12px 18px; border-radius: 10px; background: var(--ink); color: var(--paper);
    font-weight: 600; overflow-wrap: anywhere; opacity: 0; pointer-events: none;
    transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; user-select: text; }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }

  @media (min-width: 600px) {
    main { padding-top: 40px; }
    .page-title { font-size: 56px; }
    .round-title { font-size: 52px; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#app">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img class="brand-mark" src="/favicon.svg" alt="" width="24" height="24">
      <span class="brand-name">Americano Padel</span>
    </div>
    <p class="topbar-meta" id="headerInfo"></p>
  </div>
</header>

<main id="app" tabindex="-1"></main>
<footer class="site-footer">Developed by <a href="https://joash.blog" target="_blank" rel="noopener">Joash</a></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let state = {
  screen: 'setup',
  players: [],
  courts: 2,
  pointsPerMatch: 24,
  customPoints: false,
  format: 'americano',
  targetRounds: 8,
  rounds: [],
  scores: [],
  activeRound: 0,
  tournamentId: null,
  editToken: null,
  adminCode: null,
  isCreator: false,
  isViewer: false,
  createdAt: null,
};

let saveTimer = null;

function getTournamentIdFromUrl() {
  var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
  if (path && /^[a-z0-9]{4,10}$/.test(path)) return path;
  return null;
}

async function init() {
  var urlId = getTournamentIdFromUrl();
  // Capture any admin-link code and strip it from the URL up front, so the shared
  // secret never lingers in the address bar / history (even if the load fails)
  var hashMatch = window.location.hash.match(/code=([a-z0-9]{4,10})/i);
  var linkCode = hashMatch ? hashMatch[1] : null;
  if (hashMatch) history.replaceState(null, '', urlId ? '/' + urlId : '/');
  if (urlId) {
    renderLoading();
    try {
      var res = await fetch('/api/tournament?id=' + urlId);
      if (!res.ok) throw new Error('not found');
      var data = await res.json();
      state.players = data.players;
      state.courts = data.courts;
      state.pointsPerMatch = data.pointsPerMatch;
      state.rounds = data.rounds;
      state.scores = data.scores;
      state.createdAt = data.createdAt;
      state.format = data.format || 'americano';
      // targetRounds only matters for mexicano, where the backend guarantees a
      // valid value; americano never reads it, so a plain default is fine.
      state.targetRounds = state.format === 'mexicano' ? data.targetRounds : 8;
      state.tournamentId = urlId;
      state.activeRound = 0;
      state.screen = 'tournament';
      var storedToken = localStorage.getItem('americano_token_' + urlId);
      if (storedToken) {
        state.editToken = storedToken;
        state.isViewer = false;
      } else {
        state.editToken = null;
        state.isViewer = true;
      }
      state.adminCode = localStorage.getItem('americano_admin_' + urlId);
      state.isCreator = localStorage.getItem('americano_role_' + urlId) === 'creator';
      render();

      // Admin link (/<id>#code=XXXX): auto-join as admin once the tournament loads
      if (linkCode && state.isViewer) {
        joinAsAdmin(linkCode);
      } else if (!state.isViewer) {
        // Editor: re-validate the stored credential against the server (catches a
        // revoked code, syncs the current code, and confirms creator status)
        validateOnLoad();
      }
    } catch (e) {
      renderError('It may have expired. Tournaments are kept for 7 days after the last score.');
    }
  } else {
    render();
  }
}

function renderLoading() {
  document.getElementById('app').innerHTML = '<p class="loading">Loading tournament…</p>';
}

function renderError(msg) {
  document.getElementById('headerInfo').textContent = '';
  document.getElementById('app').innerHTML =
    '<h1 class="page-title">Tournament not found</h1>' +
    '<p class="lede">' + esc(msg) + '</p>' +
    '<div class="start"><button type="button" class="btn btn-primary" onclick="goHome()">Start a new tournament</button></div>';
}

function goHome() {
  history.pushState(null, '', '/');
  state = {
    screen: 'setup', players: [], courts: 2, pointsPerMatch: 24, customPoints: false,
    format: 'americano', targetRounds: 8,
    rounds: [], scores: [], activeRound: 0,
    tournamentId: null, editToken: null, adminCode: null, isCreator: false, isViewer: false, createdAt: null,
  };
  render();
}

// Safe for element text and quoted attribute values alike
function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var toastTimer = null;
function showToast(msg, ms) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, ms || 2000);
}

async function saveTournamentToServer() {
  if (!state.tournamentId || !state.editToken) return;
  try {
    var res = await fetch('/api/tournament/' + state.tournamentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        editToken: state.editToken,
        scores: state.scores,
        rounds: state.rounds,
      }),
    });
    if (await isRevoked(res)) {
      // Our credential was revoked (admin code reset) — drop back to view-only
      revokeLocalAdmin();
      showToast('Admin access ended — view only');
      render();
    } else if (!res.ok) {
      showToast('Save failed — check connection');
    }
  } catch (e) {
    showToast('Save failed — check connection');
  }
}

// A 403 means our credential was revoked only when it is this API's own
// "Unauthorized" answer to a joined admin. The creator's token is never revoked,
// and a 403 from the host itself (an access gate, an expired session) must not
// wipe credentials that can't be recovered.
async function isRevoked(res) {
  if (res.status !== 403 || state.isCreator) return false;
  try {
    var body = await res.clone().json();
    return body.error === 'Unauthorized';
  } catch (e) {
    return false;
  }
}

// Clear this device's edit credentials and revert to a read-only viewer
function revokeLocalAdmin() {
  localStorage.removeItem('americano_token_' + state.tournamentId);
  localStorage.removeItem('americano_admin_' + state.tournamentId);
  localStorage.removeItem('americano_role_' + state.tournamentId);
  state.editToken = null;
  state.adminCode = null;
  state.isCreator = false;
  state.isViewer = true;
}

function debouncedSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveTournamentToServer, 800);
}

async function createTournamentOnServer() {
  try {
    var res = await fetch('/api/tournament', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        players: state.players,
        courts: state.courts,
        pointsPerMatch: state.pointsPerMatch,
        rounds: state.rounds,
        scores: state.scores,
        format: state.format,
        targetRounds: state.targetRounds,
      }),
    });
    if (!res.ok) throw new Error('API error');
    var data = await res.json();
    state.tournamentId = data.id;
    state.editToken = data.editToken;
    state.adminCode = data.adminCode;
    state.isCreator = true;
    state.createdAt = new Date().toISOString();
    state.isViewer = false;
    localStorage.setItem('americano_token_' + data.id, data.editToken);
    localStorage.setItem('americano_admin_' + data.id, data.adminCode);
    localStorage.setItem('americano_role_' + data.id, 'creator');
    history.pushState(null, '', '/' + data.id);
  } catch (e) {
    showToast('Offline mode — no sharing');
  }
}

function shareLinkUrl() {
  return window.location.origin + '/' + state.tournamentId;
}

function adminLinkUrl() {
  return shareLinkUrl() + '#code=' + state.adminCode;
}

// When the clipboard is unavailable, show the text long enough to copy by hand
function copyText(text, doneMsg) {
  navigator.clipboard.writeText(text).then(function() {
    showToast(doneMsg);
  }).catch(function() { showToast(text, 8000); });
}

function copyShareLink() { copyText(shareLinkUrl(), 'Link copied!'); }
function copyAdminCode() { copyText(state.adminCode, 'Admin code copied!'); }
function copyAdminLink() { copyText(adminLinkUrl(), 'Admin link copied!'); }

function submitAdminCode() {
  var el = document.getElementById('adminCodeInput');
  if (el) joinAsAdmin(el.value);
}

// Validate an admin code (without modifying data) and, if valid, become an editor
async function joinAsAdmin(code) {
  code = (code || '').trim().toLowerCase();
  if (!code) return;
  try {
    var res = await fetch('/api/tournament/' + state.tournamentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ editToken: code, verifyOnly: true }),
    });
    if (res.ok) {
      // A joined admin holds the code as their credential but doesn't manage it,
      // so it isn't kept as the displayable code (only the creator shares it)
      localStorage.setItem('americano_token_' + state.tournamentId, code);
      state.editToken = code;
      state.isViewer = false;
      state.isCreator = false;
      showToast('Admin access granted');
      render();
    } else {
      showToast('Invalid admin code');
    }
  } catch (e) {
    showToast('Could not verify code');
  }
}

// Create the admin code (first time, e.g. an older tournament) or rotate it
// (revoking the old one). Creator only.
async function resetAdminCode() {
  var wasReset = !!state.adminCode;
  if (wasReset && !confirm('Reset the admin code? Anyone using the old code or link will lose access.')) return;
  try {
    var res = await fetch('/api/tournament/' + state.tournamentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ editToken: state.editToken, rotateAdminCode: true }),
    });
    if (res.ok) {
      var data = await res.json();
      state.adminCode = data.adminCode;
      localStorage.setItem('americano_admin_' + state.tournamentId, data.adminCode);
      showToast(wasReset ? 'New admin code generated' : 'Admin code created');
      render();
    } else {
      showToast('Could not update code');
    }
  } catch (e) {
    showToast('Could not update code');
  }
}

// On load, re-validate an editor's stored credential against the server. A 403
// means it was revoked (drop to view-only). Otherwise sync creator status and,
// for the creator, the current code — keeping a 2nd device or an older
// (pre-feature) tournament correct without ever exposing the code to others.
async function validateOnLoad() {
  if (!state.tournamentId || !state.editToken) return;
  try {
    var res = await fetch('/api/tournament/' + state.tournamentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ editToken: state.editToken, verifyOnly: true }),
    });
    if (await isRevoked(res)) {
      revokeLocalAdmin();
      showToast('Admin access ended — view only');
      render();
      return;
    }
    if (!res.ok) return;
    var d = await res.json();
    var changed = false;
    if (typeof d.isCreator === 'boolean' && d.isCreator !== state.isCreator) {
      state.isCreator = d.isCreator;
      if (d.isCreator) localStorage.setItem('americano_role_' + state.tournamentId, 'creator');
      changed = true;
    }
    if (d.isCreator) {
      var code = d.adminCode || null;
      if (code !== state.adminCode) {
        state.adminCode = code;
        if (code) localStorage.setItem('americano_admin_' + state.tournamentId, code);
        else localStorage.removeItem('americano_admin_' + state.tournamentId);
        changed = true;
      }
    }
    if (changed) render();
  } catch (e) { /* offline — keep current view */ }
}

// Each match needs 4 players, and there's one match per court in use
function courtsInUse(playerCount, courts) {
  return Math.min(courts, Math.floor(playerCount / 4));
}

function generateRounds(players, courts) {
  var n = players.length;
  var matchesPerRound = courtsInUse(n, courts);
  var playersPerRound = matchesPerRound * 4;
  var pairs = [];
  for (var i = 0; i < n; i++)
    for (var j = i + 1; j < n; j++)
      pairs.push([i, j]);
  var rounds = [];
  var usedPairSets = new Set();
  var playerRoundCount = new Array(n).fill(0);
  var targetRounds;
  if (playersPerRound >= n) {
    targetRounds = n - 1;
  } else {
    targetRounds = n <= 4 ? 3 : n === 5 ? 5 : n === 6 ? 6 : n === 7 ? 7 : Math.min(n + 2, 12);
  }
  for (var r = 0; r < targetRounds; r++) {
    var matches = [];
    var usedInRound = new Set();
    for (var m = 0; m < matchesPerRound; m++) {
      var bestMatch = null;
      var bestScore = -Infinity;
      for (var a = 0; a < pairs.length; a++) {
        var a1 = pairs[a][0], a2 = pairs[a][1];
        if (usedInRound.has(a1) || usedInRound.has(a2)) continue;
        var pairAKey = a1 + ',' + a2;
        for (var b = a + 1; b < pairs.length; b++) {
          var b1 = pairs[b][0], b2 = pairs[b][1];
          if (usedInRound.has(b1) || usedInRound.has(b2)) continue;
          var fourPlayers = new Set([a1, a2, b1, b2]);
          if (fourPlayers.size !== 4) continue;
          var pairBKey = b1 + ',' + b2;
          var pairANew = !usedPairSets.has(pairAKey) ? 1 : 0;
          var pairBNew = !usedPairSets.has(pairBKey) ? 1 : 0;
          var counts = [a1, a2, b1, b2].map(function(p) { return playerRoundCount[p]; });
          var totalPlayed = counts.reduce(function(s, c) { return s + c; }, 0);
          var maxCount = Math.max.apply(null, counts);
          var score = (pairANew + pairBNew) * 500 - totalPlayed * 10 - maxCount * 50;
          if (score > bestScore) {
            bestScore = score;
            bestMatch = { team1: [a1, a2], team2: [b1, b2], pairAKey: pairAKey, pairBKey: pairBKey };
          }
        }
      }
      if (!bestMatch) break;
      bestMatch.team1.forEach(function(p) { usedInRound.add(p); });
      bestMatch.team2.forEach(function(p) { usedInRound.add(p); });
      usedPairSets.add(bestMatch.pairAKey);
      usedPairSets.add(bestMatch.pairBKey);
      bestMatch.team1.forEach(function(p) { playerRoundCount[p]++; });
      bestMatch.team2.forEach(function(p) { playerRoundCount[p]++; });
      matches.push({
        team1: bestMatch.team1.map(function(i) { return players[i]; }),
        team2: bestMatch.team2.map(function(i) { return players[i]; }),
      });
    }
    if (matches.length === 0) break;
    var playing = new Set();
    matches.forEach(function(m) { m.team1.forEach(function(p) { playing.add(p); }); m.team2.forEach(function(p) { playing.add(p); }); });
    var resting = players.filter(function(p) { return !playing.has(p); });
    rounds.push({ matches: matches, rest: resting });
  }
  return rounds;
}

// Controls carry a data-key so focus survives the full re-render; pass a key to
// move focus somewhere specific (e.g. the field a blur was heading to).
function render(focusKey) {
  var active = document.activeElement;
  var key = focusKey || (active && active.getAttribute && active.getAttribute('data-key'));
  var app = document.getElementById('app');
  if (state.screen === 'setup') renderSetup(app);
  else renderTournament(app);
  if (!key) return;
  var target = app.querySelector('[data-key="' + key + '"]');
  if (!target && key.indexOf('remove-') === 0) target = document.getElementById('newPlayer');
  if (target && !target.disabled) target.focus();
}

var POINT_PRESETS = [16, 21, 24, 32];
var ICON_X ='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  var n = state.players.length;
  var minPlayers = n >= 4;
  var maxCourts = Math.floor(n / 4);
  var matchesPerRound = courtsInUse(n, state.courts);
  var playersPerRound = matchesPerRound * 4;
  var resting = n - playersPerRound;
  // A non-preset value (e.g. after "Back to setup") still has to be visible
  var customPoints = state.customPoints || POINT_PRESETS.indexOf(state.pointsPerMatch) < 0;

  app.innerHTML =
    '<h1 class="page-title">New tournament</h1>' +
    '<p class="lede">Add your players and courts, then share one link so everyone can follow the scores.</p>' +
    '<div class="form">' +

    '<section class="form-group">' +
    '<h2 class="group-title" id="formatTitle">Format</h2>' +
    '<div class="choice-row" role="group" aria-labelledby="formatTitle">' +
    ['americano', 'mexicano'].map(function(k) {
      return '<button type="button" class="choice" data-key="format-' + k + '" aria-pressed="' + (state.format === k) + '" onclick="setFormat(\'' + k + '\')">' +
        '<span class="choice-name">' + FORMATS[k].name + '</span>' +
        '<span class="choice-desc">' + FORMATS[k].desc + '</span></button>';
    }).join('') +
    '</div></section>' +

    '<section class="form-group">' +
    '<label class="group-title" for="newPlayer">Players <span class="count">(' + n + ')</span></label>' +
    '<ul class="player-list">' +
    state.players.map(function(p, i) {
      return '<li><span>' + esc(p) + '</span>' +
        '<button type="button" class="icon-btn" data-key="remove-' + i + '" aria-label="Remove ' + esc(p) + '" onclick="removePlayer(' + i + ')">' + ICON_X + '</button></li>';
    }).join('') +
    '</ul>' +
    '<div class="input-row">' +
    '<input class="input" id="newPlayer" placeholder="Player name" maxlength="30" autocomplete="off" aria-describedby="newPlayerError" onkeydown="if(event.key===\'Enter\')addPlayer()" oninput="clearPlayerError(this)">' +
    '<button type="button" class="btn btn-secondary" onclick="addPlayer()">Add</button>' +
    '</div>' +
    '<p class="field-error" id="newPlayerError" role="alert"></p>' +
    '</section>' +

    '<section class="form-group">' +
    '<h2 class="group-title" id="courtsTitle">Courts</h2>' +
    '<div class="segmented" role="group" aria-labelledby="courtsTitle">' +
    [1, 2, 3, 4].map(function(c) {
      return '<button type="button" class="seg" data-key="courts-' + c + '" aria-pressed="' + (maxCourts > 0 && state.courts === c) + '"' + (c > maxCourts ? ' disabled' : '') +
        ' onclick="state.courts=' + c + ';render()">' + c + '</button>';
    }).join('') +
    '</div>' +
    '<p class="hint">' + (minPlayers
      ? matchesPerRound + ' match' + (matchesPerRound > 1 ? 'es' : '') + ' per round, ' + playersPerRound + ' playing, ' +
        (resting > 0 ? resting + ' resting.' : 'nobody resting.')
      : 'Each court needs 4 players.') + '</p>' +
    '</section>' +

    '<section class="form-group">' +
    '<h2 class="group-title" id="pointsTitle">Points per match</h2>' +
    '<div class="segmented" role="group" aria-labelledby="pointsTitle">' +
    POINT_PRESETS.map(function(p) {
      return '<button type="button" class="seg" data-key="points-' + p + '" aria-pressed="' + (state.pointsPerMatch === p && !customPoints) + '" onclick="state.pointsPerMatch=' + p + ';state.customPoints=false;render()">' + p + '</button>';
    }).join('') +
    '<button type="button" class="seg" data-key="points-custom" aria-pressed="' + customPoints + '" onclick="state.customPoints=true;render()">Custom</button>' +
    '</div>' +
    (customPoints
      ? '<div class="inline-field"><input class="input input-sm" id="customPts" data-key="custom-points" type="number" inputmode="numeric" min="8" max="64" value="' + state.pointsPerMatch + '" aria-label="Custom points per match" onchange="state.pointsPerMatch=Math.max(8,Math.min(64,parseInt(this.value)||24));render()"><span>points</span></div>'
      : '') +
    '<p class="hint">The two scores in a match add up to this.</p>' +
    '</section>' +

    (state.format === 'mexicano'
      ? '<section class="form-group">' +
        '<label class="group-title" for="mexRounds">Rounds</label>' +
        '<div class="inline-field"><input class="input input-sm" id="mexRounds" data-key="mex-rounds" type="number" inputmode="numeric" min="2" max="20" value="' + state.targetRounds + '" onchange="state.targetRounds=Math.max(2,Math.min(20,parseInt(this.value)||8));render()"><span>rounds</span></div>' +
        '<p class="hint">Round 1 mixes everyone evenly. After that, each round is paired from the standings.</p>' +
        '</section>'
      : '') +
    '</div>' +

    '<div class="start">' +

    '</div>';
}

function renderTournament(app) {
  var rounds = state.rounds, scores = state.scores, activeRound = state.activeRound;
  var pointsPerMatch = state.pointsPerMatch;
  var isViewer = state.isViewer;
  var totalMatches = scores.reduce(function(sum, rs) { return sum + rs.filter(isMatchScored).length; }, 0);
  var totalPossible = scores.reduce(function(sum, rs) { return sum + rs.length; }, 0);
  document.getElementById('headerInfo').textContent = fmt().headerInfo(state);

  var standings = getStandings();
  var r = rounds[activeRound];
  var rs = scores[activeRound];

  function teamRow(team, value, key, mi, won) {
    var label = 'Score for ' + team[0] + ' and ' + team[1];
    // Read-only scores follow the team names in reading order, so no label is needed
    var score = isViewer
      ? '<span class="score score-static">' +
        (value !== '' ? value : '<span aria-hidden="true">–</span><span class="visually-hidden">no score yet</span>') + '</span>'
      : '<input class="score" data-key="score-' + activeRound + '-' + mi + '-' + key + '" type="number" inputmode="numeric" min="0" max="' + pointsPerMatch + '" value="' + value + '" placeholder="–" aria-label="' + esc(label) + '"' +
        ' oninput="onScoreInput(' + activeRound + ',' + mi + ',\'' + key + '\',this.value)" onblur="onScoreBlur(' + activeRound + ',' + mi + ',\'' + key + '\',event)">';
    return '<div class="team-row' + (won ? ' is-winner' : '') + '">' +
      '<span class="team-names">' + esc(team[0]) + ' <span class="amp">&amp;</span> ' + esc(team[1]) + '</span>' +
      (won ? '<span class="visually-hidden">Won</span>' : '') + score + '</div>';
  }

  var html = '';

  if (state.tournamentId) {
    html += '<div class="share-line"><div class="share-text">' +
      (isViewer ? '<span class="badge">View only</span>' : '') +
      '<p class="share-url">' + esc(shareLinkUrl().replace(/^https?:\/\//, '')) + '</p>' +
      '<p class="share-meta">Live scores link, kept for 7 days after the last score</p>' +
      '</div><button type="button" class="btn btn-secondary" onclick="copyShareLink()">Copy link</button></div>';
  }

  html += '<nav class="round-nav" aria-label="Rounds">';
  for (var i = 0; i < rounds.length; i++) {
    var d = isRoundScored(scores[i]);
    html += '<button type="button" class="round-tab' + (d ? ' is-done' : '') + '" data-key="round-' + i + '"' + (i === activeRound ? ' aria-current="true"' : '') +
      ' aria-label="Round ' + (i + 1) + (d ? ', all scores in' : '') + '" onclick="state.activeRound=' + i + ';render()">' + (i + 1) + '</button>';
  }
  html += '</nav>';

  html += '<div class="round-head"><h1 class="round-title">Round ' + (activeRound + 1) + ' <span class="of">of ' + fmt().totalRounds(state) + '</span></h1>' +
    '<p class="resting">' + (r.rest.length ? 'Resting: ' + r.rest.map(esc).join(', ') : 'Everyone plays') + '</p></div>';

  for (var mi = 0; mi < r.matches.length; mi++) {
    var m = r.matches[mi];
    var s = rs[mi];
    var scored = isMatchScored(s);
    html += '<div class="match" role="group" aria-label="Court ' + (mi + 1) + '">' +
      '<p class="court-name">Court ' + (mi + 1) + '</p>' +
      teamRow(m.team1, s.team1, 'team1', mi, scored && s.team1 > s.team2) +
      teamRow(m.team2, s.team2, 'team2', mi, scored && s.team2 > s.team1) +
      '</div>';
  }

  var roundActions = '';
  if (!isViewer) roundActions += '<button type="button" class="btn btn-text danger" data-key="clear-round" onclick="clearRound(' + activeRound + ')">Clear scores</button>';
  if (activeRound < rounds.length - 1) {
    roundActions += '<button type="button" class="btn btn-text btn-next" data-key="next-round" onclick="state.activeRound=' + (activeRound + 1) + ';render()">Next round</button>';
  }
  if (roundActions) html += '<div class="round-actions">' + roundActions + '</div>';
  if (!isViewer) html += '<div class="format-action">' + fmt().actionHtml(state) + '</div>';

  html += '<section class="section" aria-labelledby="standingsTitle">' +
    '<div class="section-head"><h2 class="section-title" id="standingsTitle">Standings</h2>' +
    '<p class="muted">' + totalMatches + ' of ' + totalPossible + ' matches played</p></div>' +
    '<table class="standings"><thead><tr>' +
    '<th scope="col" class="rank">#</th><th scope="col">Player</th><th scope="col" class="num">Played</th><th scope="col" class="num">Points</th>' +
    '</tr></thead><tbody>';
  var topPoints = standings.length ? standings[0].points : 0;
  standings.forEach(function(st, i) {
    var leader = topPoints > 0 && st.points === topPoints;
    html += '<tr' + (leader ? ' class="is-leader"' : '') + '>' +
      '<td class="rank">' + (i + 1) + '</td><td class="name">' + esc(st.name) + '</td>' +
      '<td class="num">' + st.played + '</td><td class="num pts' + (st.points === 0 ? ' is-zero' : '') + '">' + st.points + '</td></tr>';
  });
  html += '</tbody></table>';
  if (isViewer) html += '<button type="button" class="btn btn-secondary refresh" onclick="location.reload()">Refresh scores</button>';
  html += '</section>';

  // The creator manages the admin code so co-organisers can add scores too.
  // Only the creator sees/shares it (a joined admin's copy can go stale after a reset).
  if (state.tournamentId && state.isCreator) {
    html += '<section class="section" aria-labelledby="adminTitle"><h2 class="section-title" id="adminTitle">Let others keep score</h2>';
    if (state.adminCode) {
      html += '<p class="hint first">Anyone with this code can enter scores. Reset it to take that access away.</p>' +
        '<p class="admin-code">' + esc(state.adminCode) + '</p>' +
        '<div class="btn-row">' +
        '<button type="button" class="btn btn-secondary" onclick="copyAdminCode()">Copy code</button>' +
        '<button type="button" class="btn btn-secondary" onclick="copyAdminLink()">Copy admin link</button>' +
        '<button type="button" class="btn btn-text danger" onclick="resetAdminCode()">Reset code</button>' +
        '</div>';
    } else {
      html += '<p class="hint first">Create a code so co-organisers can enter scores too.</p>' +
        '<div class="btn-row"><button type="button" class="btn btn-secondary" onclick="resetAdminCode()">Create admin code</button></div>';
    }
    html += '</section>';
  }

  // Viewers can become an editor by entering the admin code
  if (state.tournamentId && isViewer) {
    html += '<section class="section">' +
      '<label class="section-title" for="adminCodeInput">Keeping score?</label>' +
      '<p class="hint first">Enter the admin code from the organiser.</p>' +
      '<div class="input-row">' +
      '<input class="input" id="adminCodeInput" placeholder="Admin code" maxlength="10" autocapitalize="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')submitAdminCode()">' +
      '<button type="button" class="btn btn-secondary" onclick="submitAdminCode()">Join</button>' +
      '</div></section>';
  }

  if (!isViewer) {
    html += '<div class="section"><button type="button" class="btn btn-text danger" onclick="confirmReset()">Back to setup</button></div>';
  }

  app.innerHTML = html;
}

function getStandings() {
  var pts = Object.create(null), played = Object.create(null);
  state.players.forEach(function(p) { pts[p] = 0; played[p] = 0; });
  state.scores.forEach(function(rs, i) {
    rs.forEach(function(s, mi) {
      if (isMatchScored(s)) {
        var m = state.rounds[i].matches[mi];
        m.team1.forEach(function(p) { pts[p] += Number(s.team1); played[p]++; });
        m.team2.forEach(function(p) { pts[p] += Number(s.team2); played[p]++; });
      }
    });
  });
  return state.players.map(function(p) { return { name: p, points: pts[p], played: played[p] }; })
    .sort(function(a, b) { return b.points - a.points || a.played - b.played; });
}

function onScoreInput(roundIdx, matchIdx, team, value) {
  // Just store the raw value — don't auto-complement yet (let user finish typing e.g. "14")
  var num = value === '' ? '' : Math.max(0, parseInt(value) || 0);
  state.scores[roundIdx][matchIdx][team] = num;
}

function onScoreBlur(roundIdx, matchIdx, team, event) {
  // On blur: clamp, compute complement, re-render
  var s = state.scores[roundIdx][matchIdx];
  var val = s[team];
  if (val === '') return;
  val = Math.max(0, Math.min(state.pointsPerMatch, val));
  s[team] = val;
  var other = team === 'team1' ? 'team2' : 'team1';
  s[other] = state.pointsPerMatch - val;
  // Keep focus on the field the user was moving to (e.g. tabbing to the next score)
  var next = event && event.relatedTarget;
  render(next && next.getAttribute && next.getAttribute('data-key'));
  debouncedSave();
}

function clearRound(idx) {
  state.scores[idx] = state.rounds[idx].matches.map(function() { return { team1: '', team2: '' }; });
  render();
  debouncedSave();
}

function addBonusRound() {
  var players = state.players;
  var n = players.length;
  var matchesPerRound = courtsInUse(n, state.courts);
  if (n < 4) return;
  var usedPartners = new Set();
  state.rounds.forEach(function(r) {
    r.matches.forEach(function(m) {
      usedPartners.add(m.team1.slice().sort().join('|'));
      usedPartners.add(m.team2.slice().sort().join('|'));
    });
  });
  var playCount = Object.create(null);
  players.forEach(function(p) { playCount[p] = 0; });
  state.rounds.forEach(function(r) {
    r.matches.forEach(function(m) {
      m.team1.forEach(function(p) { playCount[p]++; });
      m.team2.forEach(function(p) { playCount[p]++; });
    });
  });
  var allPairs = [];
  for (var i = 0; i < n; i++)
    for (var j = i + 1; j < n; j++)
      allPairs.push([players[i], players[j]]);
  var matches = [];
  var usedInRound = new Set();
  for (var m = 0; m < matchesPerRound; m++) {
    var bestMatch = null;
    var bestScore = -Infinity;
    for (var a = 0; a < allPairs.length; a++) {
      if (allPairs[a].some(function(p) { return usedInRound.has(p); })) continue;
      for (var b = a + 1; b < allPairs.length; b++) {
        if (allPairs[b].some(function(p) { return usedInRound.has(p); })) continue;
        var fourPlayers = new Set(allPairs[a].concat(allPairs[b]));
        if (fourPlayers.size !== 4) continue;
        var pairAKey = allPairs[a].slice().sort().join('|');
        var pairBKey = allPairs[b].slice().sort().join('|');
        var newPairs = (!usedPartners.has(pairAKey) ? 1 : 0) + (!usedPartners.has(pairBKey) ? 1 : 0);
        var counts = [];
        fourPlayers.forEach(function(p) { counts.push(playCount[p]); });
        var totalPlayed = counts.reduce(function(s, c) { return s + c; }, 0);
        var score = newPairs * 500 - totalPlayed * 10;
        if (score > bestScore) {
          bestScore = score;
          bestMatch = { team1: allPairs[a], team2: allPairs[b] };
        }
      }
    }
    if (!bestMatch) break;
    bestMatch.team1.forEach(function(p) { usedInRound.add(p); playCount[p]++; });
    bestMatch.team2.forEach(function(p) { usedInRound.add(p); playCount[p]++; });
    usedPartners.add(bestMatch.team1.slice().sort().join('|'));
    usedPartners.add(bestMatch.team2.slice().sort().join('|'));
    matches.push({ team1: bestMatch.team1, team2: bestMatch.team2 });
  }
  if (matches.length === 0) { alert('No more unique pairings available!'); return; }
  var playing = new Set();
  matches.forEach(function(m) { m.team1.forEach(function(p) { playing.add(p); }); m.team2.forEach(function(p) { playing.add(p); }); });
  var resting = players.filter(function(p) { return !playing.has(p); });
  state.rounds.push({ matches: matches, rest: resting });
  state.scores.push(matches.map(function() { return { team1: '', team2: '' }; }));
  state.activeRound = state.rounds.length - 1;
  render();
  debouncedSave();
}

// Must match isValidPlayerName in spacefast/functions/_shared.js, otherwise the
// server rejects the tournament and the app silently drops to offline mode.
function playerNameError(name) {
  if (name.length > 30) return 'Names can be up to 30 characters.';
  if (/[<>"'`\x00-\x1f]/.test(name)) return 'Names can’t contain < > " \' or `.';
  if (Object.prototype.hasOwnProperty.call(Object.prototype, name)) return '“' + name + '” can’t be used as a name. Try another.';
  if (state.players.includes(name)) return name + ' is already in the list.';
  return '';
}

function clearPlayerError(input) {
  input.removeAttribute('aria-invalid');
  document.getElementById('newPlayerError').textContent = '';
}

function addPlayer() {
  var input = document.getElementById('newPlayer');
  var name = input.value.trim();
  if (!name) return;
  var error = playerNameError(name);
  if (error) {
    input.setAttribute('aria-invalid', 'true');
    document.getElementById('newPlayerError').textContent = error;
    input.focus();
    return;
  }
  state.players.push(name);
  // Auto-set courts to max available when hitting a new threshold (4, 8, 12, 16)
  var maxCourts = Math.floor(state.players.length / 4);
  if (state.players.length % 4 === 0 && maxCourts >= 1 && maxCourts <= 4) {
    state.courts = maxCourts;
  }
  render();
  // render() rebuilds the form; keep the field focused for the next name
  document.getElementById('newPlayer').focus();
}

function removePlayer(idx) {
  state.players.splice(idx, 1);
  var maxCourts = Math.max(1, Math.floor(state.players.length / 4));
  if (state.courts > maxCourts) state.courts = maxCourts;
  render();
}

function setFormat(f) {
  state.format = f;
  render();
}

// --- Shared score/round helpers ---
function isMatchScored(s) { return s.team1 !== '' && s.team2 !== ''; }
function isRoundScored(rs) { return rs.every(isMatchScored); }

function lastRoundComplete() {
  var last = state.scores[state.scores.length - 1];
  return last && isRoundScored(last);
}

// Tally how many times each player has rested across all rounds so far
function restCounts() {
  var rc = Object.create(null);
  state.players.forEach(function(p) { rc[p] = 0; });
  state.rounds.forEach(function(r) {
    r.rest.forEach(function(p) { if (p in rc) rc[p]++; });
  });
  return rc;
}

// Per-format behaviour (presentation + how rounds are built) lives here so a new
// format is one entry, not scattered `state.format` checks across render/start.
function headerBase(s) {
  return s.players.length + ' players · ' + s.courts + ' court' + (s.courts > 1 ? 's' : '');
}
var FORMATS = {
  americano: {
    name: 'Americano',
    desc: 'Partners rotate on a fixed schedule',
    headerInfo: function(s) { return 'Americano · ' + headerBase(s) + ' · ' + s.rounds.length + ' rounds'; },
    totalRounds: function(s) { return s.rounds.length; },
    buildInitialRounds: function(s) { return generateRounds(s.players, s.courts); },
    actionHtml: function() { return '<button type="button" class="btn btn-secondary" data-key="format-action" onclick="addBonusRound()">Add a bonus round</button>'; },
  },
  mexicano: {
    name: 'Mexicano',
    desc: 'Each round is paired from the standings',
    headerInfo: function(s) { return 'Mexicano · ' + headerBase(s) + ' · round ' + s.rounds.length + ' of ' + s.targetRounds; },
    // Mexicano rounds are paired one at a time, so count the planned total
    totalRounds: function(s) { return s.targetRounds; },
    // Only round 1 is fixed (balanced); later rounds seed from standings
    buildInitialRounds: function(s) { return [generateRounds(s.players, s.courts)[0]]; },
    actionHtml: function(s) {
      if (s.rounds.length >= s.targetRounds) {
        return '<p class="note">All ' + s.targetRounds + ' rounds played. These are the final standings.</p>';
      }
      var ready = lastRoundComplete();
      var html = '<button type="button" class="btn btn-primary" data-key="format-action"' + (ready ? '' : ' disabled') +
        ' onclick="generateNextRound()">Pair round ' + (s.rounds.length + 1) + ' of ' + s.targetRounds + '</button>';
      if (!ready) html += '<p class="hint">Enter every score in round ' + s.rounds.length + ' to pair the next one.</p>';
      return html;
    },
  },
};
function fmt() { return FORMATS[state.format] || FORMATS.americano; }

// Mexicano: seed the next round from the live standings.
// Top 4 ranked players share court 1, next 4 court 2, etc; within each
// court of 4 ranked [1,2,3,4] the teams are 1+4 vs 2+3 (closest match-up).
function generateMexicanoRound() {
  var players = state.players;
  var n = players.length;
  var matchesPerRound = courtsInUse(n, state.courts);
  var playersPerRound = matchesPerRound * 4;
  var numResting = n - playersPerRound;

  // How often each player has rested so far (for fair rotation)
  var restCount = restCounts();

  var standings = getStandings(); // best first
  var rankOf = Object.create(null);
  standings.forEach(function(s, i) { rankOf[s.name] = i; });

  // Rest the players who have rested least; break ties by lower standing
  var resters = players.slice().sort(function(a, b) {
    return restCount[a] - restCount[b] || rankOf[b] - rankOf[a];
  }).slice(0, numResting);
  var restSet = Object.create(null);
  resters.forEach(function(p) { restSet[p] = true; });

  // Rank the playing players, split into courts of 4, pair 1+4 vs 2+3
  var playing = standings.map(function(s) { return s.name; })
    .filter(function(p) { return !restSet[p]; });
  var matches = [];
  for (var c = 0; c < matchesPerRound; c++) {
    var g = playing.slice(c * 4, c * 4 + 4);
    matches.push({ team1: [g[0], g[3]], team2: [g[1], g[2]] });
  }
  return { matches: matches, rest: resters };
}

function generateNextRound() {
  if (state.rounds.length >= state.targetRounds) return;
  if (!lastRoundComplete()) { showToast('Enter all scores first'); return; }
  var round = generateMexicanoRound();
  state.rounds.push(round);
  state.scores.push(round.matches.map(function() { return { team1: '', team2: '' }; }));
  state.activeRound = state.rounds.length - 1;
  render();
  debouncedSave();
}

async function startTournament() {
  state.rounds = fmt().buildInitialRounds(state);
  state.scores = state.rounds.map(function(r) { return r.matches.map(function() { return { team1: '', team2: '' }; }); });
  state.activeRound = 0;
  state.screen = 'tournament';
  render();
  await createTournamentOnServer();
  render();
}

function confirmReset() {
  if (confirm('Back to setup? Scores will be lost.')) {
    resetToSetup();
  }
}

function resetToSetup() {
  state.screen = 'setup';
  state.rounds = [];
  state.scores = [];
  state.activeRound = 0;
  state.customPoints = false;
  state.tournamentId = null;
  state.editToken = null;
  state.adminCode = null;
  state.isCreator = false;
  state.isViewer = false;
  state.createdAt = null;
  history.pushState(null, '', '/');
  render();
}

// Reload only when the tournament in the path changes; a fragment-only change
// (the skip link, an anchor) must not refetch and reset the open tournament.
window.addEventListener('popstate', function() {
  if (getTournamentIdFromUrl() === state.tournamentId) return;
  init();
});
init();
</script>
</body>
</html>
